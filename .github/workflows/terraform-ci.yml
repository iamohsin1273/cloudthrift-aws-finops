name: Terraform validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.3'
      - run: python scripts/package_lambda.py
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/bootstrap init -backend=false
      - run: terraform -chdir=terraform/bootstrap validate
      - run: terraform -chdir=terraform/bootstrap test -no-color
      - run: terraform -chdir=terraform/environments/dev init -backend=false
      - run: terraform -chdir=terraform/environments/dev validate
      - run: terraform -chdir=terraform/environments/dev test -no-color
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
